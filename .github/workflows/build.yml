name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Groovy 3.0.9 does not run on JDK 21, and the plugin API targets Java 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew clean test shadowJar --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 14

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-anthropic-plugin
          path: build/libs/*-all.jar
          retention-days: 90
